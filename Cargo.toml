[workspace]
resolver = "2"
members = [
    "apps/*",
    "crates/*"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Halation Core Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal crates
halation-core = { path = "crates/halation-core" }
halation-color = { path = "crates/halation-color" }
halation-raw = { path = "crates/halation-raw" }
halation-gpu = { path = "crates/halation-gpu" }
halation-pipeline = { path = "crates/halation-pipeline" }
halation-catalog = { path = "crates/halation-catalog" }
halation-ui = { path = "crates/halation-ui" }

# Foundation
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
blake3 = "1.5"

# Math & Graphics
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1.19", features = ["derive"] }
faer = "0.20"
wgpu = "23.0"

# Color & Codecs
moxcms = { version = "0.9", features = ["lut"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp"] }
zune-image = "0.4"
kamadak-exif = "0.6"

# UI & Storage
iced = { version = "0.13", features = ["wgpu", "canvas", "image", "svg"] }
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }

# Windows platform crate (declared in workspace root; inherited conditionally in crates)
windows = { version = "0.58", features = [
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem"
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
